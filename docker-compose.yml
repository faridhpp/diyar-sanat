services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: diyar
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d diyar']
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: .
      target: tools
    restart: 'no'
    environment:
      DATABASE_ADMIN_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/diyar
      DATABASE_APP_PASSWORD: ${DATABASE_APP_PASSWORD:?Set DATABASE_APP_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://diyar_app:${DATABASE_APP_PASSWORD}@postgres:5432/diyar
      APP_URL: ${APP_URL:?Set APP_URL to the public HTTPS origin}
      NEXT_PUBLIC_SITE_URL: ${APP_URL}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
      KAVENEGAR_API_KEY: ${KAVENEGAR_API_KEY:-}
      SMS_IR_API_KEY: ${SMS_IR_API_KEY:-}
      IPPANEL_API_KEY: ${IPPANEL_API_KEY:-}
      IPPANEL_SENDER: ${IPPANEL_SENDER:-}
    volumes:
      - uploads:/app/data/uploads
    expose:
      - '3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  bootstrap:
    profiles: [tools]
    build:
      context: .
      target: tools
    command: [pnpm, db:bootstrap]
    environment:
      DATABASE_URL: postgresql://diyar_app:${DATABASE_APP_PASSWORD}@postgres:5432/diyar
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-}
      BOOTSTRAP_ADMIN_PHONE: ${BOOTSTRAP_ADMIN_PHONE:-}
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
  uploads:
